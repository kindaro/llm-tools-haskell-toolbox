[project]
name = "llm-tools-haskell-toolbox"
version = "0.1"
description = "a toolbox for `llm` that lets the language model look up Haskell documentation"
readme = "README.md"
authors = [{name = ""}]
license = "Apache-2.0"
classifiers = []
requires-python = ">=3.9"
dependencies = [
    "llm>=0.26"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.entry-points.llm]
llm_tools_haskell_toolbox = "llm_tools_haskell_toolbox"

[project.optional-dependencies]
test = ["pytest", "llm-echo>=0.3a1"]
